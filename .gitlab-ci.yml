include:
  - component: dev.quiqqer.com/quiqqer/stabilization/ci-cd-components/quiqqer-package-bundle/quiqqer-package-bundle@main

# Remove the entire phpunit-php8.1 block, to allow PHPUnit to run on PHP 8.1 in your pipeline
phpunit-php8.1:
  rules:
    - when: never

# Remove the entire phpunit-php8.2 block, to allow PHPUnit to run on PHP 8.2 in your pipeline
phpunit-php8.2:
  rules:
    - when: never

# Install convert (imagemagick) and chrome (for chrome-headless)
phpunit-php8.3:
  before_script:
    - sudo apt-get update
    - cd /tmp && sudo wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - sudo apt-get install -yq /tmp/google-chrome-stable_current_amd64.deb
    - sudo apt-get install -yq imagemagick